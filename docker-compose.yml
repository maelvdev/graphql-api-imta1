services:
  movie:
    build: ./movie/
    ports:
      - "3001:3001"
  user:
    build: ./user/
    ports:
      - "3004:3004"
    environment:
      MONGO_URL: mongodb://root:example@mongo:27017/
    depends_on:
      - mongo
  booking:
    build: ./booking/
    ports:
      - "3002:3002"
    environment:
      SCHEDULE_URL: http://schedule:3003
  schedule:
    build: ./schedule
    ports:
      - "3003:3003"
  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
