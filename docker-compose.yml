services:
  movie:
    build: ./movie/
    ports:
      - "3001:3001"
  user:
    build: ./user/
    ports:
      - "3004:3004"
    environment:
      MONGO_URL: mongodb://root:example@mongo:27017/
    depends_on:
      - mongo
  booking:
    build: ./booking/
    ports:
      - "3002:3002"
    environment:
      SCHEDULE_URL: http://schedule:3003
      USER_URL: http://user:3004
    depends_on:
      - schedule
      - user
  schedule:
    build: ./schedule
    ports:
      - "3003:3003"
    environment:
      USER_URL: http://user:3004
      MOVIE_URL: http://movie:3001
    depends_on:
      - user
      - movie
  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example